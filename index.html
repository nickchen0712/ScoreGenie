<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>ScoreGenie</title>
    
    <meta name="apple-mobile-web-app-title" content="ScoreGenie">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #121212; }
        /* 💡 修正：先把 iframe 藏起來，等參數接好後再顯示 */
        iframe { width: 100%; height: 100%; border: none; opacity: 0; transition: opacity 0.5s ease-in-out; }

        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #121212; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid #333;
            border-top: 5px solid #ce93d8; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        .loader-text { color: #fff; font-family: sans-serif; font-size: 20px; font-weight: bold; letter-spacing: 2px; }
        .loader-subtext { color: #888; font-family: sans-serif; font-size: 12px; margin-top: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">🧞‍♂️ ScoreGenie</div>
        <div class="loader-subtext">魔法啟動中，請稍候...</div>
    </div>

    <iframe id="appFrame" onload="hideLoader()"></iframe>

    <script>
        // 您的原生 GAS 網址
        var gasUrl = "https://script.google.com/macros/s/AKfycbymh6lss_alVcp6-hyrQVFq9l6QJY89hq5oMks5DT7HRwmY9WY0nEwCbt7R5-jixhgE/exec";
        
        // 抓取您網域 scoregenie.app 後面的 ?report=...
        var urlParams = window.location.search;
        
        // 把參數接在 GAS 網址後面，並塞給 iframe
        document.getElementById('appFrame').src = gasUrl + urlParams;

        function hideLoader() {
            var loader = document.getElementById('loader');
            var iframe = document.getElementById('appFrame');
            loader.style.opacity = '0';
            iframe.style.opacity = '1';
            setTimeout(function() { loader.style.display = 'none'; }, 500);
        }
    </script>
</body>
</html>
