<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ScoreGenie | 高爾夫最強記分與對戰精靈</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ScoreGenie">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; min-height: 100%; width: 100%; background-color: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
        .page-container { display: none; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .active-page { display: flex; }
        
        h1, h2, h3, h4 { color: #ffffff; }
        p { color: #aaa; margin: 0 0 25px 0; font-size: 16px; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); max-width: 450px; width: 100%; border: 1px solid #333; box-sizing: border-box; margin: auto; }
        
        select, input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; background-color: #2c2c2c; color: #ffffff; border: 1px solid #444; border-radius: 8px; font-size: 16px; box-sizing: border-box; text-align: center; }
        select:focus, input:focus, textarea:focus { outline: none; border-color: #64b5f6; }
        
        button { width: 100%; padding: 15px; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 15px; transition: all 0.2s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        button:active { transform: translateY(2px); box-shadow: 0 2px 3px rgba(0,0,0,0.2); }
        button:disabled { background: #555 !important; color: #888 !important; cursor: not-allowed; }
        
        .btn-purple { background: linear-gradient(135deg, #ab47bc, #6a1b9a); }
        .btn-green { background: linear-gradient(135deg, #43a047, #1b5e20); }
        .btn-orange { background: linear-gradient(135deg, #ffa726, #e65100); }
        .btn-blue { background: linear-gradient(135deg, #29b6f6, #0277bd); }
        .btn-gray { background: linear-gradient(135deg, #78909c, #37474f); }
        .btn-gold { background: linear-gradient(135deg, #ffd700, #ffb300); color: #3e2723; } 
        .btn-red { background: linear-gradient(135deg, #ef5350, #c62828); }

        .pin-display { background: linear-gradient(135deg, #2c2c2c, #1e1e1e); border: 2px dashed #ff9800; color: #ffb74d; font-size: 24px; font-weight: bold; padding: 10px; border-radius: 8px; margin-bottom: 15px; letter-spacing: 2px; }
        
        .score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .score-grid-item { background: #2c2c2c; border: 2px solid #0277bd; padding: 10px; border-radius: 10px; }
        .score-grid-item label { display: block; font-weight: bold; color: #81d4fa; margin-bottom: 8px; font-size: 15px; }
        .score-grid-item input { font-size: 22px; color: #ff5252; background-color: #1e1e1e; margin-bottom: 0; }

        /* 💡 遺失的表格樣式補回 */
        .score-table, .dyn-table { width: 100%; border-collapse: collapse; font-size: 14px; background: #1e1e1e; table-layout: fixed; }
        .score-table th, .score-table td, .dyn-table th, .dyn-table td { border: 1px solid #444; padding: 8px; text-align: center; white-space: normal; word-wrap: break-word; overflow-wrap: break-word; }
        .score-table td:first-child, .score-table th:first-child { width: 12%; background-color: #2c2c2c; font-weight: bold; position: sticky; left: 0; z-index: 1; border-right: 2px solid #555; }
        .score-table thead th { background-color: #0277bd; color: white; position: sticky; top: 0; z-index: 2; }
        .score-table tr:nth-child(even) { background-color: #252525; }
        .dyn-table thead th { background-color: #6a1b9a; color: white; }
        .dyn-table tr:nth-child(even) { background-color: #2a2230; } 
        .highlight-row { background-color: #3e2723 !important; color: #ff8a80; }
        .score-hdcp { background-color: #2a2a2a; color: #888; font-size: 12px; font-style: italic; font-weight: normal; }
        .score-box { display: inline-flex; justify-content: center; align-items: center; width: 28px; height: 28px; font-weight: bold; box-sizing: border-box; margin: 0 auto; }
        .shape-eagle { border: 3.5px double #ff5252; border-radius: 50%; color: #ff5252; }
        .shape-birdie { border: 1.5px solid #ff5252; border-radius: 50%; color: #ff5252; }
        .shape-par { color: #64b5f6; }
        .shape-bogey { border: 1.5px solid #aaa; color: #aaa; }
        .shape-double { border: 3.5px double #aaa; color: #aaa; }

        .data-table { width: 100%; border-collapse: collapse; font-size: 14px; background: #1e1e1e; color: #fff; margin-bottom: 20px;}
        .data-table th, .data-table td { border: 1px solid #444; padding: 8px; text-align: center; }
        .data-table th { background: linear-gradient(135deg, #0277bd, #01579b); }
        .data-table tr:nth-child(even) { background-color: #252525; }

        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(10,10,10,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; transition: opacity 0.3s ease; }
        .genie-loader { font-size: 65px; margin-bottom: 15px; animation: float 1.5s ease-in-out infinite; filter: drop-shadow(0px 0px 15px rgba(206, 147, 216, 0.6)); }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }

        .gold-title { font-size: 36px; margin: 0 0 20px 0; background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728); -webkit-background-clip: text; color: transparent; text-shadow: 0px 4px 10px rgba(212, 175, 55, 0.3); letter-spacing: 2px; }
        .premium-card { background: linear-gradient(145deg, #1c1c1c, #121212); border: 1px solid #444; border-radius: 15px; padding: 25px 20px; margin-bottom: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.6); position: relative; overflow: hidden; }
        .premium-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(to right, #ab47bc, #ff9800); }
        .king-card { border: 1px solid #d4af37; box-shadow: 0 8px 25px rgba(212, 175, 55, 0.15); }
        .king-card::before { background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728); }
        .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px dashed #333; }
        .hl-item { background: #252525; padding: 12px; border-radius: 8px; margin-bottom: 10px; text-align: left; font-size: 15px; border-left: 4px solid #444; }
        .hl-birdie { border-left-color: #ce93d8; } .hl-eagle { border-left-color: #ffd700; background: linear-gradient(to right, #3e2723, #252525); } .hl-blowup { border-left-color: #e65100; background: linear-gradient(to right, #3e1111, #252525); }

        .premium-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 25px; table-layout: fixed; background: #1a1a1a; color: #fff;}
        .premium-table th { background: linear-gradient(135deg, #b38728, #fbf5b7, #aa771c); color: #121212; padding: 8px; border: 1px solid #333; }
        .premium-table td { padding: 8px; border: 1px solid #333; text-align: center; }
        .premium-table tr:nth-child(even) { background-color: #222; }
        .pt-title { color: #ffd700; font-size: 18px; text-align: left; margin: 30px 0 10px 0; border-bottom: 1px solid #ffd700; padding-bottom: 5px;}

        .net-input { width: 60px; padding: 5px; font-size: 16px; margin: 0; border: 1px solid #888; background: #333; color: #fff; text-align:center;}
    </style>
</head>
<body>

    <div id="loader" style="display:none;">
        <div class="genie-loader">🧞‍♂️</div>
        <div id="loaderText" style="color:#ce93d8; font-size:20px; font-weight:bold; letter-spacing:2px;">魔法連線中...</div>
    </div>

    <div id="dynGameModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:10000; overflow-y:auto;">
        <div style="margin: 20px auto; width: 95%; max-width: 500px; background:#1e1e1e; padding:20px; border-radius:12px; text-align: center; border: 1px solid #444;">
            <h3 style="color:#ce93d8; margin-top:0;">🎲 團體遊戲戰況</h3>
            <div id="dynGameContent" style="margin-bottom:20px; overflow-x:auto;"></div>
            <button onclick="document.getElementById('dynGameModal').style.display='none'" class="btn-gray">關閉視窗</button>
        </div>
    </div>

    <div id="imageModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:10000; overflow-y:auto;">
        <div style="margin: 20px auto; width: 90%; max-width: 400px; text-align: center;">
            <h3 style="color:#fff;">長按圖片即可儲存</h3>
            <img id="generatedImage" style="width:100%; border-radius:8px; border:2px solid white; margin-bottom: 20px;">
            <button onclick="closeImageModal()" class="btn-red">關閉視窗並離開</button>
        </div>
    </div>
    
    <div id="captureContainer" style="position:absolute; top:-9999px; left:-9999px; width: 800px; background:white; padding:20px; text-align:center;"></div>

    <div id="page-lobby" class="page-container active-page">
        <div class="card">
            <h1 style="color: #ce93d8; font-size: 32px; margin-bottom: 5px;">🧞‍♂️ ScoreGenie</h1>
            <p>專業高爾夫雲端記分</p>
            <button onclick="createSingleRoom()" class="btn-purple">✨ 建立單局記分</button>
            <button onclick="navTo('page-tourney-setup')" class="btn-gold">🏆 建立球隊多局賽 (總幹事)</button>
            <div style="margin: 20px 0; border-top: 1px solid #444; position: relative;">
                <span style="background: #1e1e1e; padding: 0 10px; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); color: #888; font-size: 14px;">或加入球局</span>
            </div>
            <input type="number" id="joinPinInput" placeholder="輸入 4 位數 PIN 碼" inputmode="numeric" style="letter-spacing: 5px; font-size: 20px; font-weight: bold;">
            <button onclick="joinRoom()" class="btn-green">🤝 加入球局</button>
        </div>
    </div>

    <div id="page-tourney-setup" class="page-container">
        <div class="card">
            <h2 class="gold-title" style="font-size:28px;">🏆 球隊賽事開局</h2>
            <label style="color:#81d4fa; font-weight:bold;">1. 選擇賽事球場</label>
            <select id="tourneyCourseSelect"><option>載入中...</option></select>
            <label style="color:#81d4fa; font-weight:bold;">2. 預計開球組數</label>
            <select id="tourneyGroupCount">
                <option value="2">2 組</option><option value="3">3 組</option><option value="4">4 組</option>
                <option value="5">5 組</option><option value="6">6 組</option><option value="8">8 組</option>
            </select>
            <label style="color:#81d4fa; font-weight:bold;">3. 預設讓桿模式</label>
            <select id="tourneyHdcpMode">
                <option value="1">標準模式 (1-18)</option><option value="2">先讓 4, 5 桿洞</option><option value="3">依序 4->5->3 桿洞</option>
            </select>
            <button onclick="createTournament()" class="btn-gold" style="margin-top:20px;">🚀 一鍵產生賽事</button>
            <button onclick="navTo('page-lobby')" class="btn-gray">🔙 取消返回</button>
        </div>
    </div>

    <div id="page-tourney-result" class="page-container">
        <div class="card" style="max-width:500px;">
            <h2 style="color:#81c784;">✅ 賽事建立成功！</h2>
            <div id="tourneyPinsArea" style="background:#2c2c2c; padding:15px; border-radius:8px; margin-bottom:20px; text-align:left;"></div>
            <p style="color:#ffd700; font-size:14px;">全隊即時排行榜網址：</p>
            <input type="text" id="tourneyDashboardUrl" readonly style="font-size:12px; color:#aaa;" onclick="this.select()">
            <button onclick="copyTourneyInfo()" class="btn-blue">📋 複製資訊分享至 LINE</button>
            <button onclick="goToTourneyDashboard()" class="btn-gold">📊 進入全隊即時排行榜</button>
        </div>
    </div>

    <div id="page-tourney-dashboard" class="page-container" style="justify-content: flex-start;">
        <h1 class="gold-title" style="margin-top:20px;">🏆 全隊即時排行榜</h1>
        <h3 id="tdCourseName" style="color:#81d4fa; margin:0 0 20px 0;"></h3>
        <div class="card" style="max-width: 600px; padding: 15px;">
            <button onclick="loadTourneyDashboard(currentTourneyId)" class="btn-blue" style="margin-bottom: 15px; padding: 10px; font-size: 16px;">🔄 更新最新戰況</button>
            <div style="overflow-x:auto;">
                <table class="data-table" id="tourneyLeaderboard">
                    <thead><tr><th style="width:20%">姓名</th><th style="width:20%">總桿</th><th style="width:25%; background:#e65100;">球隊差點</th><th style="width:20%; background:#2e7d32;">淨桿</th><th style="width:15%">明細</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <button onclick="sortTourneyLeaderboard()" class="btn-gold" style="margin-top:15px;">🏅 依淨桿重新排名</button>
            <button id="btnBackToMyGame" onclick="navTo('page-main')" class="btn-green" style="display:none;">🏌️‍♂️ 返回我的記分板</button>
            <button onclick="window.location.href='?'" class="btn-gray">🔙 返回大廳</button>
            
            <button onclick="unlockTourneyAdmin()" style="background:transparent; color:#555; border:none; box-shadow:none; font-size:12px; margin-top:30px; text-decoration:underline;">🛡️ 總幹事進階選項</button>
            <div id="adminTourneyPanel" style="display:none; margin-top:10px; border-top:1px dashed #444; padding-top:20px;">
                <button onclick="adminArchiveTourney()" class="btn-blue" style="font-size:14px; padding:10px;">📦 備份並封存此賽事</button>
                <button onclick="adminDeleteTourney()" class="btn-red" style="font-size:14px; padding:10px;">🗑️ 徹底刪除賽事</button>
            </div>
        </div>
    </div>

    <div id="page-main" class="page-container" style="justify-content: flex-start;">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="margin: 0; color: #fff;">🧞‍♂️ ScoreGenie</h2>
                <button onclick="exitRoom()" class="btn-red" style="width: auto; padding: 8px 12px; font-size: 14px; margin: 0; box-shadow: none;">離開</button>
            </div>
            
            <div class="pin-display">球局 PIN 碼：<span id="displayPin">----</span></div>
            <button id="btnSwitchToTourney" onclick="goToTourneyDashboard()" class="btn-gold" style="display:none; margin-bottom: 20px;">🏆 查看全隊即時排行榜</button>
            <button onclick="navTo('page-setup'); loadSetupData();" class="btn-gray" style="margin-bottom: 20px;">⚙️ 設定比賽資訊 (名單/讓桿)</button>
            
            <select id="holeSelect"><option value="" disabled selected>請選擇洞號</option></select>
            <div id="scoreGrid" class="score-grid"></div>
            <button onclick="submitScores()" class="btn-green">送出本洞成績</button>
            
            <hr style="margin: 20px 0;">
            <button type="button" onclick="loadScorecard()" class="btn-blue" id="btnLoadScore">📊 查看完整記分卡</button>
            
            <div id="scorecardArea" style="display:none; margin-top: 15px;">
                <div style="overflow-x: auto;"><table id="scoreTable" class="score-table"></table></div>
                <button type="button" onclick="closeScorecard()" class="btn-gray" style="margin-top:10px;">隱藏記分卡</button>
                <button type="button" onclick="loadMatchData()" class="btn-orange" style="margin-top: 10px;" id="btnLoadMatch">🏆 查看對戰成績</button>
                <button type="button" onclick="loadDynamicGame()" class="btn-purple" style="margin-top: 10px;" id="btnLoadDyn">🎲 查看團體遊戲戰況</button>
                
                <div id="matchArea" style="display:none; margin-top: 15px;">
                    <table id="matchTable" class="score-table">
                        <thead><tr><th style="background-color: #e65100;">對戰組合</th><th style="background-color: #e65100;">讓桿</th><th style="background-color: #ef6c00;">前九</th><th style="background-color: #ef6c00;">後九</th><th style="background-color: #e65100;">總和</th><th style="background-color: #0288d1;">下回讓桿</th></tr></thead>
                        <tbody></tbody>
                    </table>
                    <button type="button" onclick="closeMatch()" class="btn-gray" style="margin-top:10px;">隱藏對戰表</button>
                </div>
            </div>

            <hr style="margin: 25px 0;">
            <button id="btnGenLink" onclick="generateShareLink()" class="btn-gold">🔗 產生 Premium 專屬戰報</button>
            <button onclick="generateImage()" class="btn-blue" style="margin-top: 10px;">📸 舊版匯出截圖</button>
        </div>
    </div>

    <div id="page-setup" class="page-container">
        <div class="card">
            <h2 style="color:#fff;">⚙️ 設定比賽資訊</h2>
            <label style="color:#81d4fa; font-weight:bold; margin-top:10px; display:block;">⛳ 球場與開球設定</label>
            <select id="setupCourseSelect"><option>載入中...</option></select>
            <select id="setupTeeOff" style="margin-bottom: 5px;"><option value="OUT">Out Start (前九)</option><option value="IN">IN Start (後九)</option></select>
            <select id="setupHdcpMode"><option value="1">標準模式</option><option value="2">先讓 4, 5</option><option value="3">依序 4->5->3</option></select>
            <button onclick="applyCourse()" class="btn-orange" style="margin-bottom:20px;">套用球場與讓桿設定</button>

            <h4 style="margin: 10px 0; color: #81d4fa;">1. 球員名單</h4>
            <div id="setupPlayers" style="margin-bottom: 20px;"></div>
            <button onclick="refreshSetupMatchups()" class="btn-blue" style="margin-bottom: 20px;">🔄 確認名單並更新組合</button>
            
            <h4 style="margin: 10px 0; color: #ffcc80;">2. 對戰讓桿</h4>
            <button id="adminAutoFillBtn" onclick="autoFillHandicaps()" class="btn-purple" style="display:none; margin-bottom: 10px;">🪄 從 2026 表格自動帶入</button>
            <div id="setupHandicaps" style="margin-bottom: 20px;"></div>
            
            <h4 style="margin: 10px 0; color: #ce93d8; border-top: 1px dashed #444; padding-top:15px;">3. 團體遊戲</h4>
            <select id="dynGameMode" style="margin-bottom: 10px;">
                <option value="None">無</option><option value="LasVegas">Las Vegas</option><option value="HighLow">High-Low</option><option value="HighLowTotal">High-Low-Total</option><option value="8421">8421 點數制</option>
            </select>
            
            <button onclick="saveSetup()" class="btn-green" style="margin-top:20px;">💾 儲存並返回</button>
            <button onclick="navTo('page-main')" class="btn-gray">🔙 放棄修改</button>
        </div>
    </div>

    <div id="page-report" class="page-container" style="justify-content: flex-start; padding-top:40px;">
        <div style="max-width: 600px; margin: 0 auto; padding-bottom: 30px; width: 100%;">
            <div class="report-header">
                <h1 class="gold-title">SCOREGENIE</h1>
                <h3 style="color:#ce93d8; letter-spacing:3px;">PREMIUM 戰報</h3>
                <p id="repCourseDate" style="border-top:1px solid #333; border-bottom:1px solid #333; padding:10px 0; display:inline-block; margin:0;"></p>
            </div>
            
            <div class="premium-card king-card" style="margin-top:20px;">
                <p style="color: #ffd700; font-size: 18px; font-weight: bold; margin: 0 0 15px 0;">💰 今日賞金王</p>
                <h1 id="repKingName" style="font-size: 42px; font-weight: 900; margin: 0; color: #fff;">---</h1>
                <p id="repKingScore" style="font-size: 28px; font-weight: bold; color: #81c784; margin: 10px 0 0 0;">+0 分</p>
                <div style="position: absolute; top: -10px; right: 10px; font-size: 80px; opacity: 0.1;">👑</div>
            </div>
            
            <div class="premium-card">
                <p style="font-size: 16px; font-weight: bold; text-align: left; margin: 0 0 10px 0; color: #ce93d8;">⚔️ 戰力結算板</p>
                <div id="repStatsList"></div>
            </div>
            
            <div class="premium-card">
                <p style="font-size: 16px; font-weight: bold; text-align: left; margin: 0 0 10px 0; color: #ffd700;">✨ 榮耀時刻</p>
                <div id="repEaglesArea"></div><div id="repBirdiesArea"></div>
            </div>
            
            <div class="premium-card" style="border-color: #e65100;">
                <p style="font-size: 16px; font-weight: bold; text-align: left; margin: 0 0 10px 0; color: #e65100;">💣 團體魔鬼洞</p>
                <div id="repBlowUpArea" class="hl-item hl-blowup"></div>
            </div>
            
            <div id="repDetailedDataArea"></div>
            
            <button onclick="window.location.href='?'" class="btn-gray" style="margin-top:30px;">➕ 我也要開局</button>
        </div>
    </div>

    <script>
        // 🚨 重要：貼上您剛部署的 GAS URL
        const gasUrl = "https://script.google.com/macros/s/AKfycbymh6lss_alVcp6-hyrQVFq9l6QJY89hq5oMks5DT7HRwmY9WY0nEwCbt7R5-jixhgE/exec"; 
        
        let currentPin = ""; let currentTourneyId = "";

        async function apiCall(action, payload = {}) {
            showLoader();
            try {
