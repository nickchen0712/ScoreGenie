<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>ScoreGenie</title>
    
    <meta name="apple-mobile-web-app-title" content="ScoreGenie">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #121212; /* 配合您的深色模式 */
        }
        iframe {
            width: 100%; height: 100%; border: none;
            opacity: 0; /* 一開始先隱藏 iframe */
            transition: opacity 0.5s ease-in-out; /* 載入完成後淡入的動畫 */
        }

        /* ★ 超有質感的載入畫面 */
        #loader {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #121212;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #ce93d8; /* 魔法紫 */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        .loader-text {
            color: #fff; font-family: sans-serif;
            font-size: 20px; font-weight: bold; letter-spacing: 2px;
        }
        .loader-subtext {
            color: #888; font-family: sans-serif;
            font-size: 12px; margin-top: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">🧞‍♂️ ScoreGenie</div>
        <div class="loader-subtext">魔法啟動中，請稍候...</div>
    </div>

    <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycby5naNQkOa4DbrvFrgLpEQoeF2MYEezsv3P6QL0tDUF--VP5LlNW25PlO2u-45CYE0W/exec" onload="hideLoader()"></iframe>

    <script>
        // 當 iframe 載入完畢時觸發
        function hideLoader() {
            var loader = document.getElementById('loader');
            var iframe = document.getElementById('appFrame');
            
            // 淡出載入畫面
            loader.style.opacity = '0';
            // 淡入 App 畫面
            iframe.style.opacity = '1';
            
            // 等淡出動畫結束後，徹底移除遮罩
            setTimeout(function() {
                loader.style.display = 'none';
            }, 500);
        }
    </script>
</body>
</html>
